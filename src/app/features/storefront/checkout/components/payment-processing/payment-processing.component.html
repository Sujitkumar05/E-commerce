<div class="processing-container">
  <div class="processing-card">
    <!-- Animated Security Pulse Ring -->
    <div class="spinner-pulse-wrapper">
      <div class="pulse-ring ring-1"></div>
      <div class="pulse-ring ring-2"></div>
      <div class="spinner-core">
        <i class="fas fa-shield-alt shield-icon"></i>
      </div>
    </div>

    <!-- Status Messages -->
    <h2 class="processing-title">Processing Your Payment...</h2>
    <p class="processing-status-text">
      <i class="fas fa-circle-notch fa-spin status-spinner"></i>
      {{ checkoutService.processingStatus() }}
    </p>

    <!-- Duplicate Payment Lock Protection Notice -->
    <div class="security-notice-box">
      <div class="notice-icon">
        <i class="fas fa-lock"></i>
      </div>
      <div class="notice-text">
        <strong>Payment Lock Active</strong>
        <p>Please do not refresh the page, close this tab, or press the back button. Your transaction is being securely processed with the bank gateway.</p>
      </div>
    </div>

    <!-- Trust Badges -->
    <div class="trust-badges">
      <div class="trust-badge">
        <i class="fas fa-lock text-success"></i>
        <span>256-bit SSL Encrypted</span>
      </div>
      <div class="trust-badge">
        <i class="fas fa-check-circle text-primary"></i>
        <span>PCI-DSS Compliant</span>
      </div>
      <div class="trust-badge">
        <i class="fas fa-bolt text-warning"></i>
        <span>Instant Gateway</span>
      </div>
    </div>
  </div>
</div>
